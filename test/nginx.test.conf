server {
    listen 8080;
    server_name _;
    root /app;
    index index.php;

    client_max_body_size 64m;

    # ─── LET OP: de volgorde hieronder is essentieel ────────────────────────
    # nginx loopt de regex-locations van boven naar beneden af en gebruikt de
    # eerste die past. Staat `location ~ \.php$` vóór de deny-blokken, dan
    # wint die voor /includes/auth.php en voert PHP-FPM dat bestand gewoon uit;
    # de afscherming doet dan niets meer. Alle denies staan daarom bovenaan.
    # Dezelfde volgorde staat in docs/nginx.voorbeeld.conf.

    location ~ /\. {
        deny all;
    }

    # Deze mappen mogen nooit rechtstreeks bereikbaar zijn, ook niet als ze
    # binnen de webroot staan en ook niet als er een .php in zit.
    location ~ ^/(includes|logs|docs|opslag|sql|test)/ {
        deny all;
    }

    location ~* \.(sql|md|log|ini|sh|bak|dist|example|toegestaan)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 3600;
    }

    # Het interne blok waar download.php met X-Accel-Redirect naar verwijst.
    # Niet van buitenaf bereikbaar; alleen PHP mag hier naartoe verwijzen.
    location /beveiligd/ {
        internal;
        alias /opslag/;
    }
}
