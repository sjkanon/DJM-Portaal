server {
    listen 8080;
    server_name _;
    root /app;
    index index.php;

    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 3600;
    }

    # Het interne blok waar download.php met X-Accel-Redirect naar verwijst.
    # Niet van buitenaf bereikbaar; alleen PHP mag hier naartoe verwijzen.
    location /beveiligd/ {
        internal;
        alias /opslag/;
    }

    location ~ /\. {
        deny all;
    }

    # Zelfde afscherming als in docs/nginx.voorbeeld.conf: deze mappen mogen
    # nooit rechtstreeks bereikbaar zijn, ook niet als ze binnen de webroot staan.
    location ~ ^/(includes|logs|docs|opslag|sql|test)/ {
        deny all;
    }

    location ~* \.(sql|md|log|ini|sh|bak|dist|example|toegestaan)$ {
        deny all;
    }
}
