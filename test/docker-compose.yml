services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: djmtest
      MARIADB_DATABASE: djm_portaal
      MARIADB_USER: djm_portaal
      MARIADB_PASSWORD: djmtest
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 30

  mail:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "8125:8025"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    volumes:
      - ..:/app
    working_dir: /app
    environment:
      DB_HOST: db
      DB_NAME: djm_portaal
      DB_USER: djm_portaal
      DB_PASS: djmtest
      APP_URL: ""
      APP_KEY: testsleutel_0123456789abcdef
      OTP_PEPPER: testpepper_0123456789abcdef
      DEBUG: "true"
      DELIVERY_MODE: php
      # De ingebouwde PHP-server is standaard single-threaded; een echte browser
      # opent meerdere verbindingen tegelijk en loopt daar op vast.
      PHP_CLI_SERVER_WORKERS: "6"
    ports:
      - "8123:8080"
    command: php -S 0.0.0.0:8080 -t /app

  # ── Verse installatie: bewust zónder omgevingsvariabelen ──────────────────
  # De andere containers krijgen DB_HOST en de rest mee als echte
  # omgevingsvariabele, en die winnen van .env. Hier staat niets ingesteld, dus
  # moet setup.php het .env-bestand zelf schrijven — precies zoals bij een
  # klant op een lege server.
  #
  # De projectmap hangt er alleen-lezen in en wordt bij het starten gekopieerd
  # naar /verse. Daar draait de test op. Zo kan de wizard nooit een .env in de
  # werkmap van de ontwikkelaar achterlaten: het bestand bestaat alleen in deze
  # container en verdwijnt met de container mee.
  vers:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ..:/app:ro
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "8128:8080"
    # De kopie gaat bewust zónder opslag/ en .git. Een verse installatie heeft
    # geen video's nodig, en die map loopt in de praktijk vol: na het maken van
    # de schermafdrukken staat er zestien gigabyte aan demomateriaal in. Met een
    # gewone `cp -a /app /verse` kopieerde deze container dat bij elke start
    # opnieuw, werd hij niet op tijd bereikbaar, en viel niet alleen de verse
    # installatie om maar ook alles daarna — op een gedropte database, dus op
    # iets dat niets met de code te maken had.
    command: >
      sh -c "rm -rf /verse; mkdir -p /verse/opslag;
             tar -C /app --exclude=./opslag --exclude=./.git -cf - . | tar -C /verse -xf - &&
             chmod -R u+rwX /verse &&
             rm -f /verse/.env /verse/.env.backup-* /verse/setup.toegestaan &&
             php -S 0.0.0.0:8080 -t /verse"

  # ── nginx + PHP-FPM: de X-Accel-Redirect-route ────────────────────────────
  fpm:
    build:
      context: .
      dockerfile: Dockerfile.fpm
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ..:/app
      - ../opslag:/opslag
    environment:
      DB_HOST: db
      DB_NAME: djm_portaal
      DB_USER: djm_portaal
      DB_PASS: djmtest
      APP_URL: ""
      APP_KEY: testsleutel_0123456789abcdef
      OTP_PEPPER: testpepper_0123456789abcdef
      DEBUG: "true"
      DELIVERY_MODE: auto
      XACCEL_PREFIX: /beveiligd/
      OPSLAG_PAD: /opslag

  nginx:
    image: nginx:alpine
    depends_on:
      - fpm
    volumes:
      - ..:/app:ro
      - ../opslag:/opslag:ro
      - ./nginx.test.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8126:8080"

  # ── Apache + mod_xsendfile: de X-Sendfile-route ───────────────────────────
  apache:
    build:
      context: .
      dockerfile: Dockerfile.apache
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ..:/var/www/html
      - ../opslag:/opslag
    environment:
      DB_HOST: db
      DB_NAME: djm_portaal
      DB_USER: djm_portaal
      DB_PASS: djmtest
      APP_URL: ""
      APP_KEY: testsleutel_0123456789abcdef
      OTP_PEPPER: testpepper_0123456789abcdef
      DEBUG: "true"
      DELIVERY_MODE: auto
      OPSLAG_PAD: /opslag
    ports:
      - "8127:80"
