# ═══════════════════════════════════════════════════════════════════════════
#  DJM Portaal — voorbeeldconfiguratie voor nginx + PHP-FPM
#
#  Plaats dit bestand als /etc/nginx/sites-available/djm-portaal en activeer:
#      sudo ln -s /etc/nginx/sites-available/djm-portaal /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
#  Vervang overal:
#      portaal.example.nl      -> uw eigen domeinnaam
#      /var/www/djm-portaal    -> de map waarin dit project staat
#      /var/djm-opslag         -> de map met de videobestanden (OPSLAG_PAD)
#      php8.3-fpm.sock         -> de socket van uw PHP-versie
# ═══════════════════════════════════════════════════════════════════════════

# ─── HTTP: alles doorsturen naar HTTPS ─────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name portaal.example.nl;

    # Laat certbot zijn controle doen, stuur de rest door.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ─────────────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name portaal.example.nl;

    root  /var/www/djm-portaal;
    index index.php;

    # Certificaten van Let's Encrypt (certbot vult deze regels normaal zelf in).
    ssl_certificate     /etc/letsencrypt/live/portaal.example.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portaal.example.nl/privkey.pem;

    # Logboeken.
    access_log /var/log/nginx/djm-portaal.access.log;
    error_log  /var/log/nginx/djm-portaal.error.log;

    # ─── Uploadgrootte ─────────────────────────────────────────────────────
    # Alleen nodig als een beheerder video's via de browser wil uploaden. Voor
    # bestanden van meerdere gigabytes is SFTP de betere route; zet deze waarde
    # dan gewoon op iets ruims voor kleinere bestanden. 0 = onbeperkt.
    client_max_body_size 4G;
    client_body_timeout  300s;

    # ─── Securityheaders (vangnet; PHP stuurt ze ook zelf) ─────────────────
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "DENY"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ═══ X-Accel-Redirect ══════════════════════════════════════════════════
    # Dit is het belangrijkste blok van deze configuratie.
    #
    # download.php controleert eerst de sessie en de toegangsrechten en stuurt
    # daarna alleen een header terug:
    #
    #     X-Accel-Redirect: /beveiligd/2026/musical-2026.mp4
    #
    # nginx levert het bestand vervolgens zelf uit, buiten PHP om. Daardoor
    # gelden er geen PHP-tijdslimieten, wordt er geen geheugen verbruikt en
    # werken hervatbare downloads (HTTP Range) vanzelf.
    #
    # `internal` zorgt ervoor dat een bezoeker deze locatie NIET rechtstreeks
    # in de adresbalk kan openen: alleen een interne redirect komt hier binnen.
    #
    # LET OP: het pad hieronder moet exact overeenkomen met XACCEL_PREFIX in
    # .env, inclusief de slash aan het begin en aan het eind:
    #
    #     DELIVERY_MODE=xaccel
    #     XACCEL_PREFIX=/beveiligd/
    #     OPSLAG_PAD=/var/djm-opslag
    #
    # Vergeet de afsluitende slash bij `alias` niet — zonder die slash plakt
    # nginx de padnamen verkeerd aan elkaar.
    location /beveiligd/ {
        internal;
        alias /var/djm-opslag/;

        # Grote bestanden efficiënt uitleveren.
        sendfile     on;
        tcp_nopush   on;
        aio          threads;

        # Downloadmanagers en hervatten van afgebroken downloads.
        add_header Accept-Ranges bytes;
    }

    # ─── Verborgen bestanden weigeren (.env, .git, .htaccess, …) ───────────
    # Zonder dit blok is https://portaal.example.nl/.env gewoon te downloaden,
    # inclusief databasewachtwoord, APP_KEY en OTP_PEPPER.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ─── Mappen en bestanden die niet publiek horen te zijn ────────────────
    location ~ ^/(includes|logs|docs|opslag|sql)/ {
        deny all;
    }
    location ~* \.(sql|md|log|ini|sh|bak|dist|example|toegestaan)$ {
        deny all;
    }

    # Verwijder setup.php na de installatie. Zolang dat nog niet gebeurd is,
    # kunt u het bestand met dit blok beperken tot uw eigen IP-adres:
    # location = /setup.php {
    #     allow 203.0.113.10;
    #     deny  all;
    #     include snippets/fastcgi-php.conf;
    #     fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    # }

    # ─── Statische bestanden ───────────────────────────────────────────────
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # ─── Routering ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # ─── PHP ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        include      snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

        # download.php kan lang openstaan terwijl een grote video wordt
        # opgehaald. Bij DELIVERY_MODE=xaccel duurt de PHP-aanroep zelf maar
        # milliseconden, maar bij DELIVERY_MODE=php streamt PHP het bestand
        # zelf: dan is een ruime timeout noodzakelijk.
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;

        # Niet bufferen, zodat een PHP-stream direct doorloopt naar de bezoeker.
        fastcgi_buffering off;
    }
}

# ═══════════════════════════════════════════════════════════════════════════
#  Controleren of X-Accel werkt
#
#  1. Zet in .env:  DELIVERY_MODE=xaccel  en  XACCEL_PREFIX=/beveiligd/
#  2. Log in op het portaal en start een download.
#  3. In de access log hoort één regel voor /download.php (klein, snel) te
#     staan en één voor /beveiligd/... met de volledige bestandsgrootte.
#  4. Krijgt u een lege download of een 404? Dan komt `alias` niet overeen met
#     OPSLAG_PAD, of ontbreekt een afsluitende slash.
#  5. Open https://portaal.example.nl/beveiligd/2026/musical-2026.mp4
#     rechtstreeks: dat MOET een 404 geven. Zo niet, dan ontbreekt `internal`.
# ═══════════════════════════════════════════════════════════════════════════
