# ═══════════════════════════════════════════════════════════════════════════
#  DJM Portaal — voorbeeldconfiguratie voor Apache 2.4
#
#  Plaats dit bestand als /etc/apache2/sites-available/djm-portaal.conf en
#  activeer het:
#      sudo a2enmod rewrite headers ssl
#      sudo a2enmod xsendfile          # als mod_xsendfile geïnstalleerd is
#      sudo a2ensite djm-portaal
#      sudo apachectl configtest && sudo systemctl reload apache2
#
#  Vervang overal:
#      portaal.example.nl      -> uw eigen domeinnaam
#      /var/www/djm-portaal    -> de map waarin dit project staat
#      /var/djm-opslag         -> de map met de videobestanden (OPSLAG_PAD)
# ═══════════════════════════════════════════════════════════════════════════

# ─── HTTP: alles doorsturen naar HTTPS ─────────────────────────────────────
<VirtualHost *:80>
    ServerName portaal.example.nl

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

# ─── HTTPS ─────────────────────────────────────────────────────────────────
<VirtualHost *:443>
    ServerName  portaal.example.nl
    ServerAdmin beheer@example.nl
    DocumentRoot /var/www/djm-portaal

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/portaal.example.nl/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/portaal.example.nl/privkey.pem

    ErrorLog  ${APACHE_LOG_DIR}/djm-portaal-error.log
    CustomLog ${APACHE_LOG_DIR}/djm-portaal-access.log combined

    <Directory /var/www/djm-portaal>
        # AllowOverride All is nodig, anders wordt de meegeleverde .htaccess
        # in de projectroot genegeerd en zijn .env en logs/ gewoon leesbaar.
        AllowOverride All
        Options -Indexes +FollowSymLinks
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # ═══ X-Sendfile ════════════════════════════════════════════════════════
    # download.php controleert eerst de sessie en de toegangsrechten en stuurt
    # daarna alleen een header terug:
    #
    #     X-Sendfile: /var/djm-opslag/2026/musical-2026.mp4
    #
    # Apache levert het bestand vervolgens zelf uit, buiten PHP om. Daardoor
    # gelden er geen PHP-tijdslimieten en werkt hervatten (HTTP Range) vanzelf.
    #
    # XSendFilePath moet de map met de video's noemen — dezelfde map als
    # OPSLAG_PAD in .env. Zonder die regel weigert mod_xsendfile het pad en
    # krijgt de bezoeker een lege download.
    #
    # Installeren op Debian/Ubuntu:
    #     sudo apt install libapache2-mod-xsendfile
    #     sudo a2enmod xsendfile
    # Controleren:
    #     apachectl -M | grep xsendfile
    <IfModule mod_xsendfile.c>
        XSendFile On
        XSendFilePath /var/djm-opslag
    </IfModule>

    # ─── Securityheaders (vangnet; PHP stuurt ze ook zelf) ─────────────────
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options    "nosniff"
        Header always set X-Frame-Options           "DENY"
        Header always set Referrer-Policy           "strict-origin-when-cross-origin"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    </IfModule>

    # ─── Mappen die nooit publiek mogen zijn ───────────────────────────────
    <DirectoryMatch "/var/www/djm-portaal/(includes|logs|docs|sql)">
        Require all denied
    </DirectoryMatch>

    # Vangnet voor het geval de opslagmap toch binnen de webroot staat.
    <DirectoryMatch "/var/www/djm-portaal/opslag">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "^\.|\.(sql|md|log|ini|sh|bak|dist|example|toegestaan)$">
        Require all denied
    </FilesMatch>

    # ─── SVG onschadelijk maken ─────────────────────────────────────────────
    # Een geüpload logo in SVG-formaat kan JavaScript bevatten. In een <img>-tag
    # voert geen browser dat uit, maar bij het rechtstreeks openen van de URL
    # wel — en dan binnen onze eigen origin. Deze policy neemt dat weg, ook als
    # de opschoning bij de upload iets zou missen.
    <FilesMatch "\.svg$">
        <IfModule mod_headers.c>
            Header always set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox"
        </IfModule>
    </FilesMatch>

    # Verwijder setup.php na de installatie. Zolang dat nog niet gebeurd is,
    # kunt u het beperken tot uw eigen IP-adres:
    # <Files "setup.php">
    #     Require ip 203.0.113.10
    # </Files>
</VirtualHost>

# ═══════════════════════════════════════════════════════════════════════════
#  Geen mod_xsendfile beschikbaar?
#
#  Op veel shared hosting kan mod_xsendfile niet worden geïnstalleerd. Zet dan
#  in .env:
#
#      DELIVERY_MODE=php
#
#  PHP levert het bestand dan zelf uit, in blokken, met ondersteuning voor
#  hervatten (HTTP Range). Dat werkt prima, maar PHP moet dan wel lang genoeg
#  mogen draaien en niets mogen bufferen. Stel daarom in (php.ini, .user.ini of
#  het hostingpaneel):
#
#      max_execution_time = 0        ; geen tijdslimiet; een video van 8 GB
#                                    ; over een trage lijn duurt makkelijk een uur
#      output_buffering = Off        ; anders probeert PHP het hele bestand
#                                    ; in het geheugen te zetten
#      zlib.output_compression = Off ; comprimeren van een mp4 levert niets op
#                                    ; en breekt Content-Length
#      memory_limit = 256M           ; ruim voldoende; het bestand wordt in
#                                    ; blokken van 8 KB gelezen
#
#  Draait PHP als FPM achter Apache, verhoog dan ook:
#      ProxyTimeout 3600             (mod_proxy_fcgi)
#      Timeout 3600
#
#  Controleren of X-Sendfile werkt: start een download en kijk in het
#  access log. Bij X-Sendfile is de responsgrootte gelijk aan de
#  bestandsgrootte, terwijl PHP zelf nauwelijks tijd verbruikt. Krijgt u een
#  download van 0 bytes, dan ontbreekt XSendFilePath of wijst het naar de
#  verkeerde map.
# ═══════════════════════════════════════════════════════════════════════════
